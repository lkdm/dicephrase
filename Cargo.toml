[package]
name = "dicephrase"
version = "0.1.0"
edition = "2024"
description = "Generate secure, memorable passphrases using the EFF Large Diceware wordlist."
license = "MIT"
repository = "https://github.com/lkdm/dicephrase"
homepage = "https://github.com/lkdm/dicephrase"
readme = "README.md"
keywords = ["diceware", "password", "passphrase", "security", "cryptography"]
categories = ["command-line-utilities", "cryptography"]

[dependencies]
arboard = "3.7.0"
clap = { version = "4.6.7", features = ["derive"] }
getrandom = "0.4.3"
