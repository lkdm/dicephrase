[package]
name = "dicephrase"
version = "0.1.0"
edition = "2024"
description = "Generate secure, memorable passphrases using the EFF Large Diceware wordlist."
license = "MIT"
repository = "https://github.com/lkdm/dicephrase"
homepage = "https://github.com/lkdm/dicephrase"
readme = "README.md"
keywords = ["diceware", "password", "passphrase", "security", "cryptography"]
categories = ["command-line-utilities", "cryptography"]

[dependencies]
arboard = { version = "3.7.0", default-features = false }
clap = { version = "4.6.7", features = ["derive"] }
getrandom = { version = "0.4.3", default-features = false }
qrcode = { version = "0.14.1", default-features = false }

[profile.release]
opt-level = "z"       # Optimise for binary size
lto = true            # Link-time optimisation
codegen-units = 1     # Better cross-module optimisation
strip = true          # Strip symbols
panic = "abort"       # Remove unwinding machinery
